name: APK Android

# A ogni modifica su main (o a mano da "Actions → APK Android → Run workflow")
# costruisce l'APK e lo pubblica nelle Release del repository, pronto da scaricare sul telefono.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apk
    env:
      # sito pubblicato su Vercel (si può cambiare con la variabile APP_URL_NUOVO del repository)
      APP_URL: ${{ vars.APP_URL_NUOVO || 'https://arcieri-amiconi.vercel.app' }}
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Indirizzo dell'app
        run: node configure.mjs

      - name: Pacchetti
        run: npm install --no-audit --no-fund

      - name: Progetto Android
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#0C1210' --iconBackgroundColorDark '#0C1210' --splashBackgroundColor '#0C1210' --splashBackgroundColorDark '#0C1210'
          # testo del telefono ingrandito (Realme/Oppo con caratteri grandi): l'app lo segue fino al 115%,
          # oltre le pagine non entrano più nello schermo
          MA=$(find android/app/src/main/java -name MainActivity.java | head -1)
          PKG=$(grep -m1 '^package ' "$MA")
          printf '%s\n\nimport android.webkit.WebSettings;\nimport com.getcapacitor.BridgeActivity;\n\npublic class MainActivity extends BridgeActivity {\n    @Override\n    public void onResume() {\n        super.onResume();\n        try {\n            WebSettings s = getBridge().getWebView().getSettings();\n            if (s.getTextZoom() > 115) s.setTextZoom(115);\n        } catch (Exception e) {\n            // nessuna WebView pronta: si riprova al prossimo onResume\n        }\n    }\n}\n' "$PKG" > "$MA"
          grep -q setTextZoom "$MA"
          # fotocamera per "Scatta foto" e "Registra video"
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.CAMERA" />#' android/app/src/main/AndroidManifest.xml
          # ritorno dal login Google fatto nel browser: arcieriamiconi://accesso?ott=…
          sed -i '0,/<\/activity>/s##            <intent-filter android:autoVerify="false">\n                <action android:name="android.intent.action.VIEW" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <category android:name="android.intent.category.BROWSABLE" />\n                <data android:scheme="arcieriamiconi" />\n            </intent-filter>\n        </activity>#' android/app/src/main/AndroidManifest.xml
          grep -q 'android:scheme="arcieriamiconi"' android/app/src/main/AndroidManifest.xml
          # numero di versione = numero di build, così il telefono accetta l'aggiornamento
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          npx cap sync android
          chmod +x android/gradlew

      - name: APK firmato (se ci sono i segreti della firma)
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > release.keystore
          npx cap build android --androidreleasetype APK \
            --keystorepath "$PWD/release.keystore" --keystorepass "$KEYSTORE_PASS" \
            --keystorealias "$KEY_ALIAS" --keystorealiaspass "$KEYSTORE_PASS"
          cp "$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)" ../arcieri-amiconi.apk

      - name: APK di prova (senza segreti della firma)
        if: env.KEYSTORE_B64 == ''
        run: |
          cd android && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../arcieri-amiconi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: arcieri-amiconi-apk
          path: arcieri-amiconi.apk

      - name: Pubblica nelle Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Arcieri Amiconi 1.0.${{ github.run_number }}
          body: |
            APK per Android. Sul telefono: scarica arcieri-amiconi.apk, aprilo e consenti l'installazione.
            Commit: ${{ github.sha }}
          files: arcieri-amiconi.apk
          make_latest: true
